[plugin]
enabled = true
config_version = "1.0.0"
initial_score = 20.0
max_context_users = 20
max_prompt_length = 2000

[batch]
update_interval_seconds = 300
max_users_per_request = 50
max_messages_per_user = 30
max_pending_messages = 1000

[scoring]
normal_message_delta = 0.02
mention_bot_delta = 0.3
reply_bot_delta = 0.4
continued_conversation_delta = 0.2
helpful_interaction_delta = 0.5
duplicate_message_delta = -0.2
spam_delta = -0.3
max_positive_delta_per_period = 5.0
max_negative_delta_per_period = -5.0
max_positive_delta_per_day = 10.0
max_negative_delta_per_day = -10.0
llm_max_delta_per_period = 5.0

[decay]
enabled = false
inactive_days = 30
daily_decay = 0.5
max_decay_per_period = 2.0

[llm]
enabled = false
base_url = "https://api.openai.com/v1"
api_key = ""
model = "gpt-4o-mini"
timeout_seconds = 30
temperature = 0.2
max_tokens = 2000
send_message_content = false

[permission]
admin_user_ids = []
allow_platform_admin = true
allow_admin_query_other = true
allow_admin_modify_other = true

